<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spin the Bic Bic</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2">
  <link rel="shortcut icon" href="favicon.ico?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <meta name="theme-color" content="#14141c">
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
  <style>
    a { color: #7cc4ff; }
    /* Special effects: a see-through layer over the whole page that never blocks clicks. */
    #fx { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 20; }
    #banner { position: fixed; left: 50%; top: 38%; z-index: 21; pointer-events: none; opacity: 0; white-space: nowrap; font-size: clamp(1.8rem, 9.5vw, 4.4rem); font-weight: 900; letter-spacing: .04em; background: linear-gradient(180deg, #fff3b0, #ffc93c 55%, #e08a00); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 2px #6b3d00; filter: drop-shadow(0 6px 18px rgba(255, 190, 40, .75)); transform: translate(-50%, -50%) scale(.4); }
    #banner.show { animation: jackpot-pop 2.8s ease both; }
    @keyframes jackpot-pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-6deg); }
      12% { opacity: 1; transform: translate(-50%, -50%) scale(1.2) rotate(2deg); }
      22% { transform: translate(-50%, -50%) scale(1) rotate(0); }
      80% { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1); }
    }
    /* The jackpot card: shimmering gold until the next spin. */
    #result.jackpot { color: #3a2300; border-color: #fff3b0; background: linear-gradient(120deg, #ffe08a, #ffc93c 45%, #fff0b8 60%, #ffb800); background-size: 220% 100%; animation: jackpot-shine 1.6s linear infinite; box-shadow: 0 0 0 2px rgba(255, 220, 120, .85), 0 0 36px rgba(255, 190, 40, .75); }
    #result.jackpot #num { background: #3a2300; color: #ffd45a; }
    @keyframes jackpot-shine { to { background-position: -220% 0; } }
    @media (prefers-reduced-motion: reduce) { #result.jackpot { animation: none; } }
    #counter { visibility: hidden; margin-top: 14px; min-height: 1.3em; font-size: .85rem; color: #9a9ab0; }
    small { font-size: .75rem; color: #6a6a7e; }
    small a { color: #8b95ad; }
    body { font-family: system-ui, sans-serif; text-align: center; background: #14141c; color: #f1f1f6; margin: 0; padding: 8px 12px 24px; }
    canvas { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; width: 100%; height: auto; display: block; pointer-events: none; }
    /* The message card: the number badge and the sentence share one row. */
    #result { box-sizing: border-box; width: 100%; max-width: 460px; min-height: 5.5rem; margin: 8px auto; padding: 10px 14px; display: flex; align-items: center; justify-content: center; background: #1d1d2a; border: 1px solid #34344a; border-radius: 14px; color: #b4b4c8; font-weight: 600; transition: border-color .25s, box-shadow .25s; }
    #result .inner { line-height: 1.35; }
    #result.won { color: #fff; border-color: #e6b068; box-shadow: 0 0 0 1px rgba(230,176,104,.3), 0 6px 22px rgba(230,176,104,.18); }
    #num { display: none; background: #e6b068; color: #3a1d0e; font-weight: 800; font-size: 1.05rem; border-radius: 999px; padding: 2px 11px; margin-right: 8px; vertical-align: baseline; }
    #msg { font-size: 1rem; }
    #result.won #msg { font-size: 1.2rem; font-weight: 700; }
    .wheel-wrap { position: relative; line-height: 0; flex: none; width: min(480px, 100%, calc((100vh - 120px) * 1.0)); }
    /* Only the round wheel itself is clickable (not the empty corners or the pointer area). */
    #hit { position: absolute; left: 1.25%; top: 1.3%; width: 93.3%; height: 97.4%; border-radius: 50%; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #swap { z-index: 2; position: absolute; left: 2%; bottom: 3%; width: 48px; height: 48px; padding: 0; border-radius: 50%; font-size: 1.4rem; line-height: 1; background: #2a2a38; border: 1px solid #44445a; touch-action: manipulation; }
    #swap:active { transform: rotate(180deg); }
    #mute { z-index: 2; position: absolute; left: 2%; top: 3%; width: 48px; height: 48px; padding: 0; border-radius: 50%; font-size: 1.3rem; line-height: 1; background: #2a2a38; border: 1px solid #44445a; touch-action: manipulation; }
    .layout { display: flex; flex-direction: column; align-items: center; }
    .panel { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .controls { display: flex; flex-direction: column; align-items: center; width: 100%; }
    @media (min-width: 760px) {
      .layout { flex-direction: row; justify-content: center; align-items: stretch; gap: 24px; }
      /* Three rows (empty / message / controls): the message box is centred on the wheel,
         so it lines up exactly with the pointer. */
      .panel { width: 300px; display: grid; grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr); }
      #result { grid-row: 2; }
      .controls { grid-row: 3; align-self: start; }
      #result { min-height: 7rem; }
      #result.won #msg { font-size: 1.35rem; }
    }
    h1 { font-size: clamp(1.5rem, 7vw, 2rem); margin: 8px 0; }
    #power { width: min(300px, 80%); height: 16px; margin: 6px auto 14px; background: #2a2a38; border-radius: 8px; overflow: hidden; border: 1px solid #44445a; }
    #fill { height: 100%; width: 0; background: hsl(130,80%,50%); }
    button { user-select: none; -webkit-user-select: none; touch-action: none; font-size: 1.1rem; font-weight: bold; padding: 14px 48px; border-radius: 8px; border: 0; background: #1b9ac4; color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    /* Phones: everything must fit on one screen without scrolling. The wheel shrinks to
       whatever height is left after the title, sentence, bar, button and footer. */
    @media (max-width: 759px) {
      body { padding: 4px 12px 6px; }
      h1 { font-size: 1.5rem; margin: 6px 0 8px; }
      .wheel-wrap { width: min(480px, 100%, calc((100vh - 302px) * 1.0)); width: min(480px, 100%, calc((100dvh - 302px) * 1.0)); }
      #swap, #mute { width: 40px; height: 40px; font-size: 1.15rem; }
      #result { min-height: 5.2rem; margin: 8px auto 6px; padding: 8px 12px; }
      #result.won #msg { font-size: 1.15rem; }
      #power { margin: 4px auto 12px; height: 12px; }
      #spin { padding: 12px 40px; }
      #counter { margin-top: 10px; }
      p { margin: 4px 0 0; }
      small { font-size: .66rem; }
    }
  </style>
</head>
<body>
  <h1>Spin the Bic Bic</h1>
  <div class="layout">
    <div class="wheel-wrap">
      <canvas id="wheel" width="480" height="460"></canvas>
      <div id="hit" aria-label="Spin the wheel"></div>
      <button id="swap" aria-label="Change biscuit" title="Change biscuit">🔄</button>
      <button id="mute" hidden aria-label="Sound on or off" title="Sound on or off">🔊</button>
    </div>
    <div class="panel">
      <div id="result"><div class="inner"><span id="num"></span><span id="msg">Loading the bic bics...</span></div></div>
      <div class="controls">
        <div id="power" aria-label="Spin force"><div id="fill"></div></div>
        <button id="spin" disabled>HOLD TO SPIN</button>
      </div>
    </div>
  </div>
  <div id="counter" aria-live="polite">🍪 0 spins worldwide</div>
  <p><small>Written in Python, running in your browser via
    <a href="https://pyscript.net">PyScript</a>.
    <a href="https://github.com/manuel-verduzco/mike-echo-lima">Source on GitHub</a></small></p>
  <audio id="player" preload="none"></audio>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="banner" aria-hidden="true"></div>
  <script type="mpy" src="./web.py?v=33" config="./pyscript.toml?v=33"></script>
</body>
</html>
