<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spin the Bic Bic</title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
  <style>
    a { color: #7cc4ff; }
    small { color: #9a9ab0; }
    body { font-family: system-ui, sans-serif; text-align: center; background: #14141c; color: #f1f1f6; margin: 0; padding: 8px 12px 24px; }
    canvas { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; width: 100%; height: auto; display: block; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    #result { font-size: clamp(1.05rem, 4.5vw, 1.3rem); font-weight: bold; min-height: 5.5rem; width: 100%; max-width: 460px; margin: 8px auto; padding: 0 8px; white-space: pre-line; }
    .wheel-wrap { position: relative; line-height: 0; flex: none; width: min(460px, 100%, calc((100vh - 120px) * 0.92)); }
    #swap { position: absolute; left: 2%; bottom: 3%; width: 48px; height: 48px; padding: 0; border-radius: 50%; font-size: 1.4rem; line-height: 1; background: #2a2a38; border: 1px solid #44445a; touch-action: manipulation; }
    #swap:active { transform: rotate(180deg); }
    .layout { display: flex; flex-direction: column; align-items: center; }
    .panel { display: flex; flex-direction: column; align-items: center; width: 100%; }
    @media (min-width: 760px) {
      .layout { flex-direction: row; justify-content: center; gap: 24px; }
      .panel { width: 300px; justify-content: center; }
      #result { font-size: 1.4rem; min-height: 8rem; }
    }
    h1 { font-size: clamp(1.5rem, 7vw, 2rem); margin: 8px 0; }
    #power { width: min(300px, 80%); height: 16px; margin: 6px auto 14px; background: #2a2a38; border-radius: 8px; overflow: hidden; border: 1px solid #44445a; }
    #fill { height: 100%; width: 0; background: hsl(130,80%,50%); }
    button { user-select: none; -webkit-user-select: none; touch-action: none; font-size: 1.1rem; font-weight: bold; padding: 14px 48px; border-radius: 8px; border: 0; background: #1b9ac4; color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    /* Phones: everything must fit on one screen without scrolling. The wheel shrinks to
       whatever height is left after the title, sentence, bar, button and footer. */
    @media (max-width: 759px) {
      body { padding: 4px 12px 6px; }
      h1 { font-size: 1.5rem; margin: 4px 0; }
      .wheel-wrap { width: min(460px, 100%, calc((100vh - 270px) * 0.92)); width: min(460px, 100%, calc((100dvh - 270px) * 0.92)); }
      #swap { width: 40px; height: 40px; font-size: 1.15rem; }
      #result { font-size: 1rem; min-height: 4.4rem; margin: 2px auto 4px; padding: 0 4px; }
      #power { margin: 2px auto 8px; height: 14px; }
      #spin { padding: 12px 40px; }
      p { margin: 8px 0 0; }
    }
  </style>
</head>
<body>
  <h1>Spin the Bic Bic</h1>
  <div class="layout">
    <div class="wheel-wrap">
      <canvas id="wheel" width="460" height="500"></canvas>
      <button id="swap" aria-label="Change biscuit" title="Change biscuit">🔄</button>
    </div>
    <div class="panel">
      <div id="result">Loading Python...</div>
      <div id="power" aria-label="Spin force"><div id="fill"></div></div>
      <button id="spin" disabled>HOLD TO SPIN</button>
    </div>
  </div>
  <p><small>Written in Python, running in your browser via
    <a href="https://pyscript.net">PyScript</a>.
    <a href="https://github.com/manuel-verduzco/mike-echo-lima">Source on GitHub</a></small></p>
  <script type="mpy" src="./web.py?v=18" config="./pyscript.toml?v=17"></script>
</body>
</html>
