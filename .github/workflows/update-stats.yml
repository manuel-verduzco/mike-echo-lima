# Saves a snapshot of every sentence's counter onto the "stats-data" branch, so the stats page can
# load one small file instead of 106 separate counters. It runs by itself every 5 minutes (the
# shortest gap GitHub allows; it can start a few minutes late), and you can start it by hand:
# Actions tab -> "Update stats" -> "Run workflow".
name: Update stats

on:
  schedule:
    - cron: "3-58/5 * * * *"   # minutes 3, 8, 13 ... (off the busy top of the hour)
  workflow_dispatch:

permissions:
  contents: write   # to commit stats.json to the stats-data branch

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'manuel-verduzco/mike-echo-lima'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read the counters and save stats.json
        run: bash .github/scripts/save_stats.sh
